[project]
name = "atlas-agent"
version = "0.1.0"
description = "Atlas — Autonomous RWA Alpha Strategist agent core (Mantle)"
requires-python = ">=3.10"
dependencies = [
    "web3>=6.20",
    "eth-account>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "hmmlearn>=0.3.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "anthropic>=0.34",
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]
